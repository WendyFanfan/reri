[build]
  # 构建前端的命令
  command = "cd rerisnap-website && npm install && npm run build"
  # 构建输出目录
  publish = "rerisnap-website/dist"
  # Netlify 函数目录
  functions = "netlify/functions"

[dev]
  # 指定本地开发函数端口
  functions = "netlify/functions"
  # 本地前端开发端口
  port = 5173
  # SPA 刷新支持
  publish = "rerisnap-website/dist"

[[redirects]]
  # 支持 SPA 刷新
  from = "/*"
  to = "/index.html"
  status = 200
